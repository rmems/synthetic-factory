[package]
name = "silicon-bridge-transport"
description = "Process adapter driving a Spikena ut FPGA board over UART through the silicon-bridge crate."
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0 OR MIT"

[dependencies]
silicon-bridge = "=0.3.0"
serialport = { version = "4.3", default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }

[[bin]]
name = "silicon-bridge"
path = "src/main.rs"
