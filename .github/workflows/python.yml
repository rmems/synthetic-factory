name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python 3.14)
    runs-on: ubuntu-latest
    # Full rights replay/promotion coverage exceeded the prior 20-minute hosted-runner budget.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install bubblewrap for the code-repair OS sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all --die-with-parent --uid 65534 --gid 65534 /bin/true

      - name: Compile Python sources and tests
        run: python -m compileall -q pipelines scripts tests .claude/skills/run-synthetic-factory/driver.py

      - name: Install coverage.py
        run: python -m pip install coverage==7.15.4

      - name: Install Rust oracle toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Check and build crate-backed oracle
        run: |
          cargo +1.98.1 fmt --all --check
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          cargo +1.98.1 test --locked -p sf-oracle
          cargo +1.98.1 build --locked -p sf-oracle

      - name: Exercise native generation through local export
        env:
          SF_ORACLE_RUST_BIN: ${{ github.workspace }}/target/debug/sf-oracle
        run: python3 -m unittest discover -s tests -p 'test_oracle_rust_end_to_end.py' -v

      - name: Run unit tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate coverage report
        run: |
          python -m coverage report --show-missing
          python -m coverage xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rmems/synthetic-factory
