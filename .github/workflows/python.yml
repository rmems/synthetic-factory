name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded pull request runs are cancelled. Every other run (pushes, a
# schedule, manual dispatches) gets its own group by run id, so a
# queued run there is never replaced by a later one either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff correctness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      # Option A: operator-facing steps call just so the justfile cannot drift
      # from CI. Pin versions are read from justfile variables.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Install ruff
        run: python -m pip install --only-binary ':all:' "ruff==$(just --evaluate ruff_version)"

      # Correctness rules only: pyflakes, syntax errors, pylint errors and bugbear. The default
      # rule set still reports thousands of style findings and is not gated. Ignored here:
      # PLE0605 (the `"...".split()` __all__ idiom), B007 (flags a for/else loop variable
      # read after `break`), B008 (frozen-dataclass defaults), B009/B010 (style) and B905
      # (strict= would change zip() behaviour). Expansion: just/python.just `lint`.
      - name: Lint correctness rules
        run: just lint

  oracle:
    name: crate-backed oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Install coverage.py
        run: python -m pip install --only-binary ':all:' "coverage==$(just --evaluate coverage_version)"

      - name: Install Rust oracle toolchain
        run: rustup toolchain install "$(just --evaluate rust_toolchain)" --profile minimal --component rustfmt,clippy

      # Restores ~/.cargo registry/git and target/ keyed on Cargo.lock and the rustc
      # version, so an unchanged lockfile skips the cold dependency build.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check and build crate-backed oracle
        run: just rust-check

      - name: Exercise native generation through local export
        env:
          SF_ORACLE_RUST_BIN: ${{ github.workspace }}/target/debug/sf-oracle
        run: just oracle-e2e

      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-oracle
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  shard:
    name: unittest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Four parallel runners keep the full suite within the hosted-runner budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install bubblewrap for the code-repair OS sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all --die-with-parent --uid 65534 --gid 65534 /bin/true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Compile Python sources and tests
        run: just compile

      - name: Install coverage.py
        run: python -m pip install --only-binary ':all:' "coverage==$(just --evaluate coverage_version)"

      - name: Run unittest shard with branch coverage
        run: just ci-shard ${{ matrix.shard }}

      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: unittest (Python 3.15)
    needs: [lint, shard, oracle]
    # A failed prerequisite would otherwise skip this job, and a skipped required
    # check reads as passing to branch protection, so it runs unless the whole run
    # was cancelled (a superseded push), in which case it is skipped with the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Gate, coverage combine and Codecov upload take about a minute.
    timeout-minutes: 10
    steps:
      # Strict on purpose: a shard that hits timeout-minutes, or one cancelled from the
      # UI while the run continues, reports `cancelled` here and must keep this job red.
      # One comparison per command, so each failing result stops the step under `bash -e`
      # on its own, independent of where it sits in the script.
      - name: Require the lint gate, every shard and the oracle job to have succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
        run: |
          echo "lint=$LINT_RESULT shard=$SHARD_RESULT oracle=$ORACLE_RESULT"
          test "$LINT_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$ORACLE_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Install coverage.py
        run: python -m pip install --only-binary ':all:' "coverage==$(just --evaluate coverage_version)"

      - name: Download coverage shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage reports
        run: |
          python -m coverage combine
          python -m coverage report --show-missing
          python -m coverage xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rmems/synthetic-factory
