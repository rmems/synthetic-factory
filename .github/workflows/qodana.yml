name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

# Superseded pull request runs are cancelled. Every other run (pushes, a
# schedule, manual dispatches) gets its own group by run id, so a
# queued run there is never replaced by a later one either.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Community Python only. qodana-python-community does not need Qodana Cloud,
  # so this job runs on Dependabot and fork pull requests as well as ordinary
  # ones. The paid qodana-python linter required Ultimate Plus, and that
  # membership has expired.
  qodana:
    runs-on: ubuntu-latest
    # Recent scans finish in two to six minutes.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
          persist-credentials: false
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          args: -e QODANA_PYTHON_PATH=/opt/miniconda3/bin/python3
          use-caches: false
          upload-result: true
        # No QODANA_TOKEN / QODANA_ENDPOINT: Community does not talk to Cloud.
